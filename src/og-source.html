<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; }
    html, body { width: 1200px; height: 630px; margin: 0; overflow: hidden; }
    body {
      position: relative;
      padding: 68px 76px;
      color: #202526;
      background: #f6f7f4;
      font-family: "Noto Sans SC", "Microsoft YaHei", Arial, sans-serif;
      letter-spacing: 0;
    }
    .logo { width: 230px; }
    .eyebrow { margin: 74px 0 0; color: #465e73; font: 700 17px/1 Bahnschrift, Arial, sans-serif; }
    .eyebrow::before { display: inline-block; width: 34px; height: 4px; margin-right: 15px; background: #c77a4d; content: ""; vertical-align: middle; }
    h1 { max-width: 700px; margin: 24px 0 0; font-size: 52px; line-height: 1.25; }
    h1 span { color: #465e73; }
    .geo { position: absolute; bottom: 66px; left: 76px; color: #465e73; font: 700 14px/1 Bahnschrift, Arial, sans-serif; }
    .mark { position: absolute; right: 72px; top: 130px; width: 340px; height: 340px; }
    .rule { position: absolute; right: 76px; bottom: 66px; left: 76px; height: 1px; background: rgba(32,37,38,.18); }
  </style>
</head>
<body>
  <img class="logo" src="assets/logo-primary.svg" alt="ONEPIECE STUDIO">
  <p class="eyebrow">CHENGDU · MOBILE GAME STUDIO</p>
  <h1>和伙伴一起，做让人<span>快乐</span>的游戏。</h1>
  <div class="geo">JAPAN · GLOBAL</div>
  <img class="mark" src="assets/logo-mark.svg" alt="">
  <div class="rule"></div>
</body>
</html>
